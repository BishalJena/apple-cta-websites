# Cloudflare Pages project serving https://bishal.app
# Static sites: public/<app>/ (generated by tools/site-builder/build.py)
# Waitlist API: functions/[app]/api/join.js → POST /<app>/api/join
name = "bishal-app"
pages_build_output_dir = "./public"
compatibility_date = "2026-09-01"

[[d1_databases]]
binding = "DB"
database_name = "waitlist-db"
# D1 ids are identifiers, not credentials: access still needs a Cloudflare token.
database_id = "43f0edef-9a7f-4a86-aab6-f8cd3f2df13b"
