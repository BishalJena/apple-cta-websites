# Cloudflare Worker serving the seven waitlist sites at https://bishal.app/lotus-*/
# The rest of bishal.app is a separate Pages project (the main site).
#   Static pages: public/<app>/ (generated by tools/site-builder/build.py)
#   Waitlist API: src/index.js → POST /<app>/api/join
name = "lotus-waitlists"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true

routes = [
  { pattern = "bishal.app/lotus-*", zone_name = "bishal.app" },
]

[assets]
directory = "./public"

[[d1_databases]]
binding = "DB"
database_name = "waitlist-db"
# D1 ids are identifiers, not credentials: access still needs a Cloudflare token.
database_id = "43f0edef-9a7f-4a86-aab6-f8cd3f2df13b"
