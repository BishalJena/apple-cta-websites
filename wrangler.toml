# Cloudflare Pages project "bishal-app-pages" — serves all of https://bishal.app
#   /            catalogue (public/index.html, apps.js generated by tools/site-builder/build.py)
#   /lotus-*/    the seven waitlist sites (generated by tools/site-builder/build.py)
#   POST /<app>/api/join → functions/[app]/api/join.js → D1 (binding DB)
# Pages is Git-connected: every push to main deploys. public/ is committed, so there's no build step.
name = "bishal-app-pages"
pages_build_output_dir = "./public"
compatibility_date = "2026-09-01"

[[d1_databases]]
binding = "DB"
database_name = "waitlist-db"
# D1 ids are identifiers, not credentials: access still needs a Cloudflare token.
database_id = "43f0edef-9a7f-4a86-aab6-f8cd3f2df13b"
